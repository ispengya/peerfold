name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0). Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds use CGO against libfuse3 (cgofuse -tags=fuse3).
          # Windows uses CGO_ENABLED=0 so cgofuse's nocgo variant demand-loads
          # winfsp.dll at runtime and the build needs no WinFsp headers.
          - os: ubuntu-latest
            asset: peerfold-linux-amd64
            goos: linux
            goarch: amd64
            cgo: "1"
            tags: fuse3
          - os: ubuntu-24.04-arm
            asset: peerfold-linux-arm64
            goos: linux
            goarch: arm64
            cgo: "1"
            tags: fuse3
          - os: windows-latest
            asset: peerfold-windows-amd64.exe
            goos: windows
            goarch: amd64
            cgo: "0"
            tags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install FUSE headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse3-dev gcc pkg-config

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          TAGS_FLAG=""
          if [ -n "${{ matrix.tags }}" ]; then
            TAGS_FLAG="-tags=${{ matrix.tags }}"
          fi
          go build -trimpath -ldflags "-s -w" $TAGS_FLAG -o "${{ matrix.asset }}" ./cmd/peerfold
          ls -la "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # A tag push always publishes. workflow_dispatch publishes only when the
    # caller names a tag; otherwise this job just verifies the build.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Stage installers
        # The install scripts ride along as release assets so the one-liner
        # can fetch them from github.com/.../releases/download/... . Hosts
        # that block raw.githubusercontent.com still reach that URL.
        run: |
          cp install.sh install.ps1 install.bat dist/
          cd dist
          sha256sum peerfold-* install.* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
